name: Official docs checks

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  pinned-aggregate:
    name: Pinned aggregate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned docs dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Test source and ownership contracts
        run: python -m unittest discover -s tests -p '*_test.py' -v
      - name: Clone exact active documentation sources
        run: python scripts/bootstrap_docs_sources.py --root build/sources
      - name: Assemble and strictly build the pinned site
        shell: bash
        run: |
          python scripts/assemble_docs.py --source-root build/sources --output build/assembled-ci
          python -m mkdocs build --strict --clean -f build/assembled-ci/mkdocs.yml
