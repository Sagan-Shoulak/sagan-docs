name: Documentation preview

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build exact-lock preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Test source, ownership, and evidence contracts
        run: python -m unittest discover -s tests -p '*_test.py' -v

      - name: Clone exact active documentation sources
        run: python scripts/bootstrap_docs_sources.py --root build/preview-sources

      - name: Assemble and strictly build the preview
        run: |
          python scripts/assemble_docs.py \
            --source-root build/preview-sources \
            --output build/assembled-preview
          python -m mkdocs build --strict --clean \
            -f build/assembled-preview/mkdocs.yml

      - name: Record preview provenance and checksums
        run: |
          python scripts/docs_preview_evidence.py \
            --assembled build/assembled-preview \
            --output build/preview-evidence.json

      - name: Upload non-production preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-lock-docs-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            build/assembled-preview/build/docs-site/
            build/assembled-preview/sources.json
            build/preview-evidence.json
